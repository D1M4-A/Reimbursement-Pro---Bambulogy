name: Deploy site to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p /tmp/github-pages-site
          cp index.html /tmp/github-pages-site/index.html
          cp 404.html /tmp/github-pages-site/404.html
          cp ReimbursementPro.html /tmp/github-pages-site/ReimbursementPro.html
          cp runtime-config.js /tmp/github-pages-site/runtime-config.js
          python - <<'PY' > /tmp/github-pages-site/runtime-config.js
          import json, os

          config = {
              "SUPABASE_URL": os.getenv("SUPABASE_URL", "").strip(),
              "SUPABASE_ANON_KEY": os.getenv("SUPABASE_ANON_KEY", "").strip(),
          }

          print("window.RUNTIME_CONFIG = Object.assign(window.RUNTIME_CONFIG || {}, {")
          for key, value in config.items():
              print(f"  {key}: {json.dumps(value)},")
          print("});")
          print("Object.entries(window.RUNTIME_CONFIG).forEach(([key, value]) => {")
          print("  if (typeof value === 'string' && value) window[key] = value;")
          print("});")
          PY
          touch /tmp/github-pages-site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/github-pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
